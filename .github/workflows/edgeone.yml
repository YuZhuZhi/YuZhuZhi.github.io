name: Deploy EdgeOne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v4
      - uses: astral-sh/setup-uv@v7

      - name: Build website
        run: uv run build.py build -f

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to EdgeOne
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
          EDGEONE_AREA: ${{ vars.EDGEONE_AREA }}
        run: |
          : "${EDGEONE_API_TOKEN:?Set the EDGEONE_API_TOKEN repository secret}"
          : "${EDGEONE_PROJECT_NAME:?Set the EDGEONE_PROJECT_NAME repository variable}"
          case "$EDGEONE_AREA" in
            global|overseas) ;;
            *) echo "Set EDGEONE_AREA to global or overseas to match the EdgeOne project" >&2; exit 1 ;;
          esac
          npx --yes edgeone@1.6.44 makers deploy ./_site \
            --name "$EDGEONE_PROJECT_NAME" \
            --env production \
            --area "$EDGEONE_AREA" \
            --token "$EDGEONE_API_TOKEN" \
            --skip-ai-gateway-sync
